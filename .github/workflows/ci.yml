name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  shared-packages:
    name: Shared packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.6
          channel: stable
          cache: true

      - name: Resolve the workspace
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      - name: Test shared packages
        run: |
          set -e
          for package in packages/*/; do
            echo "::group::${package}"
            if grep -q 'sdk: flutter' "${package}pubspec.yaml"; then
              # Flutter packages (ui) need the Flutter test runner.
              (cd "${package}" && flutter test)
            else
              # Pure Dart packages run on the VM and in Chrome.
              (cd "${package}" && dart test -p vm,chrome)
            fi
            echo "::endgroup::"
          done
