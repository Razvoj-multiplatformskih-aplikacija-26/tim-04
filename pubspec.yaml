name: utociste_workspace
description: Utočište za životinje, one system in one language. The workspace resolves every app and package together.
publish_to: none

environment:
  sdk: ^3.13.0

workspace:
  - apps/backoffice
  - apps/mobile
  - packages/api_contract
  - packages/blocs
  - packages/domain
  - packages/ui
  - packages/use_cases

dev_dependencies:
  flutter_lints: 6.0.0