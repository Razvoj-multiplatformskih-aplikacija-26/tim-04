name: utociste

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-utociste}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env first}
      POSTGRES_DB: ${POSTGRES_DB:-utociste}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./apps/server/db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-utociste}:${POSTGRES_PASSWORD:?Copy .env.example to .env first}@db:5432/${POSTGRES_DB:-utociste}?sslmode=disable
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8081}
      NOTIFIER_API_KEY: ${NOTIFIER_API_KEY:-dev-fake}
    ports:
      - "${SERVER_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy

  adminer:
    image: adminer:5
    profiles: [tools]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-utociste}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env first}
      POSTGRES_DB: ${POSTGRES_DB:-utociste}
    ports:
      - "127.0.0.1:${ADMINER_PORT:-8082}:8080"
    depends_on:
      - db

volumes:
  db-data:
